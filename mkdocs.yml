site_name: RAGUnit
site_description: The evaluation library for RAG pipelines — Java-native, 100% local, zero cloud dependency.
site_url: https://ragunit.org/
copyright: Copyright &copy; 2026 Baretto — Apache 2.0
repo_url: https://github.com/baretto-labs/ragunit
repo_name: baretto-labs/ragunit
edit_uri: ""

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  logo: assets/logo-baretto.png
  favicon: assets/favicon.png

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Metrics:
    - Overview: metrics/index.md
    - Faithfulness: metrics/faithfulness.md
    - Answer Relevancy: metrics/answer-relevancy.md
    - Rejection: metrics/rejection.md
    - Prompt Injection: metrics/prompt-injection.md
    - PII Leak: metrics/pii-leak.md
    - Context Precision: metrics/context-precision.md
    - Context Recall: metrics/context-recall.md
    - Factual Correctness: metrics/factual-correctness.md
    - Semantic Similarity: metrics/semantic-similarity.md
  - Guides:
    - Cookbook: cookbook.md
    - Variance Control: variance-control.md
    - Custom Prompts: custom-prompts.md
    - Generic Evaluation: judge-query.md
    - Deterministic Assertions: deterministic-assertions.md
    - Testset Generation: testset-generation.md
  - Providers:
    - Overview: providers.md
    - Ollama: integrations/ollama.md
    - Custom Adapters: integrations/adapters.md
  - Contributing: contributing.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/baretto-labs/ragunit-documentation
