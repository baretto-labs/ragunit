site_name: RAGUnit
site_description: The evaluation library for RAG pipelines — Java-native, 100% local, zero cloud dependency.
site_url: https://baretto-labs.github.io/ragunit-documentation
repo_url: https://github.com/baretto-labs/ragunit-documentation
repo_name: baretto-labs/ragunit
edit_uri: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  logo: assets/logo.png
  favicon: assets/favicon.png

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Metrics:
    - Overview: metrics/index.md
    - Faithfulness: metrics/faithfulness.md
    - Answer Relevancy: metrics/answer-relevancy.md
    - Rejection: metrics/rejection.md
    - Prompt Injection: metrics/prompt-injection.md
    - PII Leak: metrics/pii-leak.md
    - Context Precision: metrics/context-precision.md
    - Context Recall: metrics/context-recall.md
    - Factual Correctness: metrics/factual-correctness.md
    - Semantic Similarity: metrics/semantic-similarity.md
  - Testset Generation: testset-generation.md
  - Cookbook: cookbook.md
  - Integrations:
    - Overview: integrations/index.md
    - Ollama: integrations/ollama.md
    - Custom Adapters: integrations/adapters.md
  - Custom Prompts: custom-prompts.md
  - Variance Control: variance-control.md
  - Generic Evaluation: judge-query.md
  - Contributing: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/baretto-labs/ragunit-documentation
