name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Build and test (fast — excludes @RagTest)
        run: mvn clean verify --batch-mode --no-transfer-progress

  mutation:
    name: Mutation Testing (ragunit-core)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run PITest (threshold 80%)
        run: |
          mvn -pl ragunit-core --batch-mode --no-transfer-progress \
            test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PITest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: ragunit-core/target/pit-reports/
          retention-days: 30
